# Serves the prerendered site (from `yarn build.ssg`), matching how production behaves:
# pages are always revalidated, while hashed bundles are cached for a year

map $uri $cache_control {
    ~^/(build|assets)/  "public, max-age=31536000, immutable";
    default             "public, max-age=0, must-revalidate";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Redirect with relative URLs, so they still work when the port is remapped
    absolute_redirect off;

    charset utf-8;
    charset_types text/css text/plain text/xml text/yaml application/javascript application/json;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml text/yaml application/javascript application/json
               application/manifest+json image/svg+xml;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Serve pages with or without a trailing slash, as production does
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # nginx's mime.types has no entry for YAML, used by the checklist data file
    location ~* \.ya?ml$ {
        default_type text/yaml;
    }

    error_page 404 /404.html;

    # Used by the image's HEALTHCHECK
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
